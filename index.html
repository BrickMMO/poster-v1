<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Poster Control</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>LEGO Poster Control</h1>
        </header>

        <div class="controls-container">
            <!-- Window 1 -->
            <div class="control-box" id="window-1">
                <div class="button-grid">
                    <button class="control-button" id="btn-fans-1" data-control="fans-1" aria-label="Toggle Fans 1">
                        <i class="fas fa-fan"></i>
                    </button>
                    <button class="control-button" id="btn-lights-1" data-control="lights-1" aria-label="Toggle Lights 1">
                        <i class="fas fa-lightbulb"></i>
                    </button>
                    <button class="control-button" id="btn-room-1" data-control="room-1" aria-label="Toggle Room 1">
                        <i class="fas fa-door-open"></i>
                    </button>
                </div>
            </div>

            <!-- Window 2 -->
            <div class="control-box" id="window-2">
                <div class="button-grid">
                    <button class="control-button placeholder" disabled aria-label="Button 4">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="control-button placeholder" disabled aria-label="Button 5">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="control-button placeholder" disabled aria-label="Button 6">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <!-- Window 3 -->
            <div class="control-box" id="window-3">
                <div class="button-grid">
                    <button class="control-button placeholder" disabled aria-label="Button 7">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="control-button placeholder" disabled aria-label="Button 8">
                        <i class="fas fa-plus"></i>
                    </button>
                    <button class="control-button placeholder" disabled aria-label="Button 9">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>
        </div>

        <footer>
            <p class="connection-status" id="connection-status">
                <span class="status-dot"></span>
                <span class="status-label">Connecting to Firebase...</span>
            </p>
        </footer>
    </div>

    <!-- Firebase SDK (Compat version for global firebase object) -->
    <script src="https://www.gstatic.com/firebasejs/10.6.0/firebase-compat.js"></script>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>
</html>
